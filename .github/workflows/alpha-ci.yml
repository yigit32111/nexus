name: NEXUS Release CI
on:
  push:
    branches: ["feature/nexus-3.3-alpha1", "feature/nexus-4.0"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
      - name: Production smoke test (no account or provider keys)
        run: |
          npm run start > /tmp/nexus-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/nexus-smoke.log' EXIT
          node tests/smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Live service smoke test (anonymous only)
        run: node tests/smoke.mjs
        env:
          SMOKE_URL: https://nexus-ifn5.onrender.com
      - name: Desktop and mobile login browser smoke
        run: |
          npm run start -- --port 3001 > /tmp/nexus-browser.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/nexus-browser.log' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:3001/login >/dev/null && break; sleep 1; done
          kill -0 "$pid"
          SMOKE_URL=http://127.0.0.1:3001 node tests/browser-smoke.mjs
          SMOKE_URL=http://127.0.0.1:3001 node tests/browser-workspace.mjs
          node tests/local-load.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
