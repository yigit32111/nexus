name: NEXUS Alpha CI
on:
  push:
    branches: ["feature/nexus-3.3-alpha1"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
      - name: Production smoke test (no account or provider keys)
        run: |
          npm run start > /tmp/nexus-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/nexus-smoke.log' EXIT
          node tests/smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
